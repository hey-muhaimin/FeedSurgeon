<!-- Tailwind configuration conforming to Outloop Quiet Confidence tokens -->
<script data-purpose="tailwind-config">

        extend: {

<body class="bg-[#FAF9F5] text-[#202720] min-h-screen flex flex-col justify-between font-['Manrope',sans-serif] selection:bg-[#D8E3CF] antialiased">

<main class="w-full max-w-[390px] min-h-screen mx-auto flex flex-col justify-between px-5 pt-3 pb-7 sm:py-6" data-purpose="screen-container">

<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>

</button>

<div class="h-1.5 flex-1 bg-[#29362E] rounded-full"></div>
<div class="h-1.5 flex-1 bg-[#29362E] rounded-full"></div>
<div class="h-1.5 flex-1 bg-[#E1DED5] rounded-full"></div>
<div class="h-1.5 flex-1 bg-[#E1DED5] rounded-full"></div>
</div>
</header>
<!-- Header & Intro Section -->
<section class="mt-1 mb-6" data-purpose="screen-title-section">
<!-- Soft Tint Grid Icon Badge -->
<div class="w-11 h-11 rounded-2xl bg-[#D8E3CF]/50 border border-[#C3C8C2]/60 flex items-center justify-center text-[#29362E] mb-4">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">

<rect height="6.5" rx="1.5" width="6.5" x="14" y="3.5"></rect>
<rect height="6.5" rx="1.5" width="6.5" x="3.5" y="14"></rect>
<rect height="6.5" rx="1.5" width="6.5" x="14" y="14"></rect>

</div>

</section>

<p class="text-xs text-[#737874] font-medium font-['Plus_Jakarta_Sans',sans-serif]">Block Shorts</p>

<!-- Toggle Switch (Active - Forest 900) -->

</button>

</div>
</section>
</div>
<!-- Bottom Action CTA -->
<footer class="pt-3 pb-1" data-purpose="footer-action">
<button class="w-full h-14 bg-[#29362E] hover:bg-[#142119] active:scale-[0.98] text-white font-semibold text-[17px] rounded-full shadow-md transition-all duration-150 flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-[#29362E]/20" type="button">
        Continue
      </button>
</footer>
</main>
<!-- Interactive Script for Toggle Buttons -->
<script data-purpose="toggle-interaction">
    function toggleSwitch(button) {
      const isChecked = button.getAttribute('aria-checked') === 'true';
      const thumb = button.querySelector('span:not(.sr-only)');
      
      if (isChecked) {
        button.setAttribute('aria-checked', 'false');
        button.classList.remove('bg-[#29362E]');
        button.classList.add('bg-[#E1DED5]');
        thumb.classList.remove('translate-x-5');
        thumb.classList.add('translate-x-0');
      } else {
        button.setAttribute('aria-checked', 'true');
        button.classList.remove('bg-[#E1DED5]');
        button.classList.add('bg-[#29362E]');
        thumb.classList.remove('translate-x-0');
        thumb.classList.add('translate-x-5');
      }
    }
  </script>
